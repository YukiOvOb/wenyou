<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="长夜书局">
<meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)">
<title>长夜书局</title>
<style>
:root{
  --ground:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#1f2530; --muted:#687282; --faint:#98a1ad;
  --line:#d9dee4; --accent:#2f5d62; --accent-ink:#ffffff; --accent-soft:#dfeceb;
  --rose:#b3475d; --rose-soft:#f5e3e7; --amber:#a86a12; --amber-soft:#f6ecd9; --danger:#b3261e;
  --shadow:0 10px 40px rgba(20,30,40,.18);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --read-size:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12161b; --surface:#1a2028; --surface-2:#161b22; --ink:#e3e7ec; --muted:#95a0ad; --faint:#66707c;
    --line:#2a323d; --accent:#7fb3ad; --accent-ink:#0f1a19; --accent-soft:#1e3230;
    --rose:#e08a9c; --rose-soft:#3a2229; --amber:#e0b060; --amber-soft:#3a2f1c; --danger:#f28b82;
    --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#12161b; --surface:#1a2028; --surface-2:#161b22; --ink:#e3e7ec; --muted:#95a0ad; --faint:#66707c;
  --line:#2a323d; --accent:#7fb3ad; --accent-ink:#0f1a19; --accent-soft:#1e3230;
  --rose:#e08a9c; --rose-soft:#3a2229; --amber:#e0b060; --amber-soft:#3a2f1c; --danger:#f28b82;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--ground);min-height:52px}
.bar h1{font:600 19px/1.2 var(--serif);margin:0;flex:1;letter-spacing:.06em}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font:600 16px/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;overscroll-behavior:contain}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-h{font:600 13px/1 var(--sans);color:var(--muted);letter-spacing:.12em;margin:22px 0 10px}
.sec-h:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--faint);font-size:14px;padding:6px 0}

/* shelf */
.script-card h3{font:600 18px/1.35 var(--serif);margin:0 0 4px}
.script-card p{margin:6px 0 10px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.save-item{display:flex;gap:12px;align-items:center;cursor:pointer}
.save-item .meta{flex:1;min-width:0}
.save-item b{font:600 16px/1.35 var(--serif);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-item small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-badge{font:600 12px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 8px;min-width:48px;text-align:center}

/* log */
#log{padding:18px 18px 28px}
.entry{margin-bottom:22px}
.act{display:flex;justify-content:flex-end;margin:0 0 14px}
.act span{max-width:86%;background:var(--accent-soft);color:var(--ink);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:14.5px;white-space:pre-wrap}
.narr{font:var(--read-size)/1.95 var(--serif);letter-spacing:.02em}
.narr p{margin:0 0 .9em;text-indent:2em}
.narr .dlg{color:var(--accent)}
.turn-mark{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:0 0 12px;font-variant-numeric:tabular-nums}
.turn-mark::before,.turn-mark::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;margin-top:4px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.c-ev{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.chip.c-ch{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.c-up{color:var(--accent)} .chip.c-down{color:var(--rose)}
.chip.c-af{border-color:var(--rose);color:var(--rose);background:var(--rose-soft)}
.warn-line{font-size:12.5px;color:var(--amber);margin-top:6px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{display:flex;align-items:stretch;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.choice button{border:0;background:transparent;text-align:left;padding:11px 14px;flex:1;font-size:15px;line-height:1.5}
.choice button.edit{flex:0 0 44px;border-left:1px solid var(--line);color:var(--muted);text-align:center;padding:0}
.choice button:active{background:var(--surface-2)}
.choices-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.link-btn{border:0;background:transparent;color:var(--accent);font-size:13px;padding:4px 2px}
.choice.editing{flex-direction:column;border-color:var(--accent)}
.choice-edit{border:0;background:transparent;padding:11px 14px 6px;font:inherit;font-size:15px;line-height:1.5;resize:none;width:100%}
.choice-edit:focus{outline:none}
.choice-custom{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:10px 14px;text-align:left;color:var(--muted);font-size:14.5px}
.tools{display:flex;gap:4px;justify-content:center;margin-top:12px}
.streaming-hint{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;margin:6px 0}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.error-box{border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;white-space:pre-wrap}

#composer{border-top:1px solid var(--line);background:var(--ground);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.input-row{display:flex;gap:8px;align-items:flex-end}
#action{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:42px;max-height:130px;line-height:1.5}
#send{min-width:64px;height:42px}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:760px;margin:0 auto;height:88%;background:var(--ground);border-radius:18px 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;padding:8px 8px 0 16px}
.sheet-head b{flex:1;font:600 16px/1 var(--serif)}
.tabs{display:flex;gap:2px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:99px;color:var(--muted);white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px 24px}

.stat-row{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.stat-row:last-child{border-bottom:0}
.stat-row .lbl{color:var(--muted);font-size:14px}
.stat-row .val{font-variant-numeric:tabular-nums;font-size:14px}
.meter{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.rose i{background:var(--rose)}
.txt-val{grid-column:2 / 4;font-size:14.5px}

.char{display:flex;gap:12px;cursor:pointer}
.avatar{flex:0 0 44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:600 19px/1 var(--serif);color:#fff}
.char .body{flex:1;min-width:0}
.char .name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.char .name b{font:600 16px/1.3 var(--serif)}
.char .name small{color:var(--muted);font-size:12.5px}
.char .op{font-size:13.5px;color:var(--muted);margin:4px 0 8px}
.mini-meters{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dim{opacity:.55}

.ev{display:grid;grid-template-columns:3.2em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ev:last-child{border-bottom:0}
.ev .t{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.ev b{font-weight:600}
.ev p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.ev.done b{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid currentColor}
.pill.major{color:var(--amber)} .pill.ok{color:var(--accent)} .pill.fail{color:var(--rose)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field .hint{font-size:12px;color:var(--faint)}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:14px}
.check input{margin-top:4px;width:18px;height:18px}
textarea.code{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:55vh}

/* modal */
#modal-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,20,.45)}
#modal{background:var(--ground);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){#modal-wrap{align-items:center}#modal{border-radius:18px;max-height:86%}}
.modal-head{padding:16px 16px 8px;font:600 17px/1.3 var(--serif)}
.modal-body{padding:4px 16px 8px;overflow-y:auto;flex:1}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:88%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:.95}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
details.fold{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;background:var(--surface)}
details.fold summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.note-list{margin:4px 0 0;padding-left:1.2em;font-size:13.5px;color:var(--muted)}
.setup-intro{font:15.5px/1.85 var(--serif);white-space:pre-wrap;margin:0 0 6px}

/* 篇幅/节奏开关 */
.pace-bar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.pace-bar .grp{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 11px;font-size:13px;color:var(--muted);min-height:30px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pace-bar .cur{margin-left:auto;max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

/* 词条 */
.traits{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.trait{font-size:12px;border:1px dashed var(--accent);color:var(--accent);border-radius:6px;padding:1px 7px}
.trait.unk{border-color:var(--line);color:var(--faint)}
.trait-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.trait-list li{border:1px dashed var(--accent);border-radius:10px;padding:8px 11px;font-size:14px;background:var(--surface)}
.trait-list li b{color:var(--accent);font-weight:600}
.trait-list li small{color:var(--faint);margin-left:6px}
.chip.c-rv{border-style:dashed;border-color:var(--accent);color:var(--accent)} /* 划线收藏 */ mark.hl{background:transparent;background:color-mix(in srgb,var(--accent) 13%,transparent);color:inherit;text-decoration:underline 2px var(--accent);text-underline-offset:4px;text-decoration-skip-ink:none;border-radius:2px;cursor:pointer} .mark-btn{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:10px 20px;font-size:15px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.22);-webkit-user-select:none;user-select:none;touch-action:manipulation} .mark-btn[hidden]{display:none} .mark-text{font:15.5px/1.85 var(--serif);white-space:pre-wrap} .mark-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px} .chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 11px;font-size:12.5px;min-height:28px} .chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .faint{color:var(--faint)} .full-turn{border-bottom:1px solid var(--line);padding:12px 0} .full-text p{font:15.5px/1.85 var(--serif);margin:.4em 0} mark.q{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px} .entry.flash{animation:flash 1.6s ease-out} @keyframes flash{0%{background:color-mix(in srgb,var(--accent) 16%,transparent)}100%{background:transparent}}
.turn-mark .rw{border:0;background:transparent;color:var(--accent);font-size:12px;padding:2px 4px;cursor:pointer;flex:0 0 auto}
.turn-mark .rw:disabled{color:var(--faint)}
.roll{display:flex;flex-direction:column;gap:10px}
.roll-item .row{flex-wrap:nowrap}
.roll-item select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px}
.dice{flex:0 0 42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:19px;line-height:1;color:var(--accent)}
.roll-item .desc{font-size:13px;color:var(--muted);line-height:1.65;margin-top:5px}
.roll-item .lbl{font-size:13px;color:var(--muted);margin-bottom:5px}
.roll-item .desc.extra{white-space:pre-wrap;font-size:12.5px;color:var(--faint);margin-top:4px}
.roll-item .desc.extra:empty{display:none}
.update-card{border-color:var(--accent);margin-bottom:16px}
.char .basic{font-size:12.5px;color:var(--muted);margin:2px 0 4px;line-height:1.5}
#update-bar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:70;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15);font-size:14px;line-height:1.5}
#update-bar span{flex:1}
.unmet{margin-top:14px}
.dice.ai{color:var(--rose)}
.dice:disabled{opacity:.5}

/* 方案与文风 */
.opt-card{display:flex;gap:10px;align-items:flex-start}
.opt-card .body{flex:1;min-width:0}
.opt-card b{font:600 15.5px/1.4 var(--serif)}
.opt-card p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.badge{font-size:11.5px;border-radius:99px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.multi{display:flex;flex-direction:column;gap:6px}
.multi label{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.5;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.multi input{margin-top:3px;width:17px;height:17px;flex:0 0 auto}
.multi small{display:block;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div id="app">

  <!-- 书架 -->
  <section class="view" id="v-shelf">
    <header class="bar">
      <h1>长夜书局</h1>

<script>
'use strict';
/* =========================================================
   长夜书局 · AI 文字冒险引擎
   结构：存储 → 设置 → 剧本 → 状态 → 上下文拼装 → API → 解析/合并 → 游戏循环 → 界面
   ========================================================= */

const APP_VERSION = 1;
const BUILD = '2026-09-29.5'; // 网页版本号：每次发布都改一下，打开着的页面会拿它和网站上的最新版比较
const STATE_MARK = '###STATE###';

/* ---------------- 工具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, lo, hi) => Math.min(hi ?? Infinity, Math.max(lo ?? -Infinity, v));
const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^\d.+-]/g, '')); return Number.isFinite(n) ? n : d; };
const str = v => (v === undefined || v === null) ? '' : String(v).trim();
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function fmtTime(t) {
  const d = new Date(t), now = new Date();
  const p = n => String(n).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return `今天 ${p(d.getHours())}:${p(d.getMinutes())}`;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function hueOf(s) { let x = 0; for (const c of String(s)) x = (x * 31 + c.codePointAt(0)) % 360; return x; }
function avatarEl(c) {
  const ch = c.avatar && [...c.avatar].length <= 2 ? c.avatar : [...(c.name || '?')][0];
  return h('div', { class: 'avatar', style: `background:hsl(${hueOf(c.name)} 32% 44%)` }, ch);
}
let toastTimer;
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
function download(filename, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function pickFile() {
  return new Promise(res => {
    const inp = $('#file-in'); inp.value = '';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => res(null); r.readAsText(f); };
    inp.click();
  });
}

/* ---------------- 存储（IndexedDB，失败时退回 localStorage） ---------------- */
const DB = {
  db: null, fallback: false,
  open() {
    return new Promise(res => {
      try {
        const req = indexedDB.open('changye-wenyou', 1);
        req.onupgradeneeded = () => { const db = req.result; for (const s of ['kv', 'scripts', 'saves']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); };
        req.onsuccess = () => { this.db = req.result; res(); };
        req.onerror = () => { this.fallback = true; res(); };
      } catch { this.fallback = true; res(); }
    });
  },
  _ls(store) { try { return JSON.parse(localStorage.getItem('cy_' + store) || '{}'); } catch { return {}; } },
  _lsw(store, o) { try { localStorage.setItem('cy_' + store, JSON.stringify(o)); } catch (e) { toast('存储空间不足，存档可能没有保存'); } },
  tx(store, mode, fn) {
    return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); });
  },
  async get(store, id) { if (this.fallback) return this._ls(store)[id] || null; return (await this.tx(store, 'readonly', s => s.get(id))) || null; },
  async all(store) { if (this.fallback) return Object.values(this._ls(store)); return (await this.tx(store, 'readonly', s => s.getAll())) || []; },
  async put(store, val) { if (this.fallback) { const o = this._ls(store); o[val.id] = val; this._lsw(store, o); return; } await this.tx(store, 'readwrite', s => s.put(val)); },
  async del(store, id) { if (this.fallback) { const o = this._ls(store); delete o[id]; this._lsw(store, o); return; } await this.tx(store, 'readwrite', s => s.delete(id)); },
};

/* ---------------- 设置 ---------------- */
const DEFAULT_SETTINGS = {
  baseUrl: 'https://api.deepseek.com',
  apiKey: '',
  model: 'deepseek-v4-pro',
  thinking: 'enabled',    // enabled 开启 | disabled 关闭 | default 不发送参数（交给服务商默认）

  modelList: [],          // 上次从接口拉到的模型
  settingsV: 2,
  temperature: 1.3,
  maxTokens: 32000,
  length: 'mid',          // 新游戏默认篇幅 short | mid | long
  pace: 'normal',         // 新游戏默认节奏 slow | normal | fast
  prefs: null,            // 基础偏好，见 DEFAULT_PREFS
  profiles: null,         // 故事口味方案，见 DEFAULT_PROFILES
  defaultProfile: 'p-ensemble',
  customStyles: [],       // 我的文风库 [{id,name,text}]
  genHistory: [],         // 最近 AI 生成过的主角，用来避免重复
  scriptPrefs: {},        // 剧本设置 {剧本id: {length, pace, profileId, style, useGlobalPrefs}}
  recentTurns: 3,       // 原文保留回合数
  summaryInterval: 3,     // 每累积多少回合压缩一次
  memoryMaxChars: 1500,   // 剧情摘要上限
  snapshotLimit: 30,      // 最多可回退回合数
  rewindTurns: 3,         // 最近几回合显示“重选”
  globalStyle: '',        // 全局写作偏好
  theme: 'auto',
  readSize: 17,
  usage: { prompt: 0, completion: 0, cached: 0, calls: 0 },
};
let S = clone(DEFAULT_SETTINGS);
async function loadSettings() {
  const rec = await DB.get('kv', 'settings');
  S = Object.assign(clone(DEFAULT_SETTINGS), rec ? rec.value : {});
  S.prefs = Object.assign(clone(DEFAULT_PREFS), S.prefs || {});
  if (!Array.isArray(S.profiles) || !S.profiles.length) S.profiles = clone(DEFAULT_PROFILES);
  if (!Array.isArray(S.customStyles)) S.customStyles = [];
  if (!S.scriptPrefs || typeof S.scriptPrefs !== 'object') S.scriptPrefs = {};
  if (!S.aiOptions || typeof S.aiOptions !== 'object') S.aiOptions = {};
  const savedV = rec ? (rec.value?.settingsV || 1) : DEFAULT_SETTINGS.settingsV;
  if (savedV < 2) {
    // v2：玩家要求默认开启思考模式；输出上限要容得下思考过程
    S.thinking = 'enabled'; S.effort = S.effort || 'high';
    S.maxTokens = Math.max(num(S.maxTokens, 0), 32000);
    if (S.model === 'deepseek-flash') S.model = 'deepseek-v4-pro'; // 旧默认模型 → 效果最好的模型
    delete S.disableThinking; S.settingsV = 2;
  }
  if (!Array.isArray(S.modelList)) S.modelList = [];
  if (S.defaultProfile !== 'none' && !S.profiles.find(p => p.id === S.defaultProfile)) S.defaultProfile = S.profiles[0].id;
  applyTheme();
}
async function saveSettings() { await DB.put('kv', { id: 'settings', value: S }); applyTheme(); }
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  r.style.setProperty('--read-size', (S.readSize || 17) + 'px');
}
/* ---------------- 篇幅与节奏（两个独立维度） ---------------- */
const LENGTH_TEXT = { short: '300～500 字', mid: '600～900 字', long: '1000～1500 字' };

  normal: '标准节奏：推进一到两个剧情节拍，故事里的时间可以过去十几分钟到一两个小时，场景跟着玩家的行动走。',

篇幅决定写得多细，节奏决定剧情推进多远。

节奏：${PACE_TEXT[P].replace(/^[^：]+：/, '')}
合起来就是：${LENGTH_HOW[L]}，同时${P === 'slow' ? '只推进很小的一步' : P === 'fast' ? '推进一整段剧情' : '推进一到两步'}。篇幅长、节奏慢时，笔墨花在同一时刻的细节上；篇幅短、节奏快时，用概括的叙述带过。`;
}

const STYLE_PRESETS = [

 "world": "【作品】唐家三少《斗罗大陆》（第一部）的同人二创。原著的情节、人物、魂技、地名等细节以你对原著的了解为准；本剧本改动的地方以本剧本为准。\n\n【核心】\n主角是一名和武魂殿关系很深的年轻女魂师。故事按原著的时间线推进，视角在武魂殿这一边。武魂殿免费为平民觉醒武魂、发放魂师补助、清剿邪魂师。教皇殿和供奉殿各有打算，高层想统一大陆。主角的行动会改变原著里一些事情的结果。\n\n【年龄调整】\n本剧本把原著中所有人的年龄整体上调六岁：原著里唐三等人十二岁报考史莱克学院，本剧本中是十八岁，其他人相应上调。魂力等级、修炼进度和事件顺序不变。故事开始时，所有登场人物都已成年。\n\n【世界】\n- 斗罗大陆上有天斗、星罗两大帝国，武魂殿的地位在两大帝国之上。上三宗（昊天宗、七宝琉璃宗、蓝电霸王龙家族）和许多宗门、家族各有地盘。\n- 魂师：每个人六岁觉醒武魂，有先天魂力的人才能修炼。等级：魂士（1～10）、魂师（11～20）、大魂师（21～30）、魂尊（31～40）、魂宗（41～50）、魂王（51～60）、魂帝（61～70）、魂圣（71～80）、魂斗罗（81～90）、封号斗罗（91～99）。每到十的整数级，要猎杀魂兽、吸收魂环才能突破。魂环颜色：白（十年）、黄（百年）、紫（千年）、黑（万年）、红（十万年）。魂骨非常稀有。货币是金魂币、银魂币、铜魂币。\n- 武魂殿：总部在武魂城。教皇比比东管理教皇殿；长老殿的长老都是封号斗罗，比如菊斗罗月关、鬼斗罗鬼魅；供奉殿由大供奉千道流（天使斗罗）领头，地位最高。武魂殿的殿堂从低到高分为分殿、子殿、主殿（大城市）、圣殿（两大帝国的首都）、教皇殿、供奉殿，由主教、执事管理。索托城是主殿。天斗城的武魂圣殿由白金主教萨拉斯负责，他是四大白金主教之一。\n- 武魂殿做的事：每年派魂师到各地给六岁的孩子免费觉醒武魂；魂师在武魂殿注册后，每月凭徽章到武魂殿领取补贴，魂师（11 级）起每月一个金魂币；注册和加入武魂殿是两回事，加入后才是武魂殿专属的魂师；清剿邪魂师；在武魂城开办武魂殿学院，培养有天赋的年轻人。\n- 武魂殿高层想统一大陆，对十万年魂兽化形的人和敌对的宗门手段很狠。\n- 武魂殿的中下层成员大多是普通人，各有家人、生计和自己的想法。\n- 武魂殿学院的“黄金一代”：胡列娜、邪月、焱，是武魂殿年轻一辈里最出色的三个人。三人突破五十级时，会被教皇亲自授予紫录勋章。全大陆高级魂师学院精英大赛的参赛者要在三十一岁以下（本剧本年龄）。\n\n【开局时间】\n每一局可以从不同的原著时间点开始（开篇、精英大赛前夕、猎魂行动前夕等），开局时已经发生过的主线节点标在【主线时间线】里，每个原著人物此刻的处境见人物卡的“现状”。下面【故事开始前】写的是原著开篇时的情况。\n\n【故事开始前】\n唐三前世是唐门弟子，转生成圣魂村铁匠唐昊的儿子。他六岁觉醒蓝银草武魂，在诺丁学院认识了小舞，拜玉小刚（大师）为师。故事开始时，他和小舞刚到索托城，准备报考史莱克学院，之后会和戴沐白、奥斯卡、马红俊、宁荣荣、朱竹清组成“史莱克七怪”。同一时间，武魂殿的少主千仞雪正假扮成太子“雪清河”，潜伏在天斗皇室。\n\n【主角】\n主角是女性。她的出身、起点、武魂、天赋每一局都不一样，见【主角身世】和主角状态。她对武魂殿的感情是真实的，可能是感激或忠诚。她了解到武魂殿高层的图谋和手段后，这份感情可能动摇。她开局能接触到哪些人和事，由她在武魂殿的位置决定。",
 "rules": "1. 原著事件照常推进。主角不在场时，原著里的事件照原样发生（被主角改变过的除外），主角可以通过传闻、公文或别人转述知道。主角在场时，她的选择可以改变事件的过程和结果。\n2. 唐三和其他人一样受这个世界的规则约束。他聪明、能吃苦，擅长暗器和算计。他做成事靠事先的准备，也要付出代价；他会判断失误，也会失败。别人对他的看法取决于和他打过的交道。他护短，对敌人下手狠，和武魂殿对立时更明显。\n3. 女性角色各有自己的目标。小舞想以人的身份自由地活下去；她和唐三感情很深，这份感情是亲情、依恋还是爱情，由剧情发展决定。宁荣荣想证明自己是能上阵的魂师，不想只被人看作“七宝琉璃宗的小公主”。朱竹清身上有星罗帝国的婚约，她的生死取决于星罗皇子继承之争的结果；她清楚戴沐白生活放纵，一直在找自己的出路。胡列娜、千仞雪、比比东各有自己的骄傲和痛处。她们之间可以相识、较量、成为朋友。\n4. 戴沐白在索托城和一对双胞胎姐妹厮混过。身边的人（尤其是朱竹清）都记得这件事，也会评价。\n5. 实力体系前后一致。主角的成长合理：魂力提升慢，吸收魂环有风险，越级战斗要付出代价。封号斗罗的实力远在年轻魂师之上，年轻魂师打不过封号斗罗。主角能用的魂技数量等于她的魂环数。\n6. 武魂殿内部有规矩、派系和人情。上级的命令、同僚的嫉妒、平民魂师的感激和不满、教皇殿和供奉殿的矛盾，都可以写进剧情。\n7. 武魂殿里的称呼：教皇称“教皇冕下”或“冕下”，长老称“某长老”，供奉称“大供奉”“某供奉”，也可以尊称封号；学员称老师为“老师”。\n8. 没有重要事件的时候，可以用一两句话跳过几周到几个月，让主线按原著的时间往前走。\n9. 战斗时交代双方用了第几魂环的哪个魂技、魂环是什么颜色、魂技有什么效果，以及双方各自怎么应对。",

 "world": "【作品】唐家三少《琴帝》的同人二创。原著的情节、人物、魔法、地名等细节以你对原著的了解为准；本剧本改动的地方以本剧本为准。\n\n【核心】\n主角是一名年轻女性，故事开始时在米兰城。故事按原著的时间线推进：米兰魔武学院的新生大赛、秋天兽人南下、东龙八宗立国、大陆战争、深渊之战。主角的行动会改变原著里一些事情的结果。原著里的人物各有自己的目标和经历，剧情围绕主角和她身边的人展开。\n\n【年龄调整】\n本剧本把原著中所有人的年龄整体上调两岁：原著里叶音竹十六岁到米兰魔武学院报考，本剧本中是十八岁，其他人相应上调。和年龄挂钩的规矩一起上调两岁：米兰贵族女子二十岁订婚、二十一岁到婚配的年纪；七国七龙排位战的人类参赛者不超过二十七岁。修炼等级、修炼进度和事件顺序不变。故事开始时，所有登场人物都已成年。\n\n【原著人物的感情】\n原著里叶音竹和苏拉、海洋、香鸾、安雅等人之间的感情、婚姻和子女，只是原著的走向。本剧本里，每个人物的感情从她自己的经历、立场和与人的相处出发，跟着剧情和主角的影响发展。人物之间的关系可以是友情、竞争、合作、爱情或别的。\n\n【世界】\n- 大陆：龙崎努斯大陆。约一万年前，东边漂来的东龙大陆和西方大陆相撞，撞击处裂开“天之裂痕”，深渊位面的妖曼涌出，深渊之神是母妖王。东龙帝国（黑发黑眸，斗气强，骑金色的东方巨龙）和比蒙、龙族结盟抵抗，最后四十七条金色神龙用身体封住了裂痕。约一千年后，西方人类建立西龙帝国，联合龙族进攻东龙，东龙抵抗约一百年后亡国。西龙帝国在封印处设立圣地“法蓝”，后来分裂成现在的八个国家。黑发黑眸是东龙血统的标志，西方原住的人类没有。\n- 法蓝：大陆中心的圣地，在米兰正南方。大陆各国（极北荒原除外）都信仰法蓝，问候、感叹、让人慎言时都说“赞美法蓝”。法蓝有七塔：光明塔、暗塔、魂塔、水塔、火塔、风塔、土塔。塔主对外号称紫级九阶，尊称“圣魔导师”，实际都是次神级（白级），年龄接近或超过三百岁。监察官和塔主平级，负责监督塔主，兼任十二圣骑士团团长。八国魔法师公会的会长都由法蓝任命，法蓝的命令是魔法师的最高指令。修炼违反彩虹等级规则的人是“异端”，要上报七塔，下场通常是死。法蓝每隔一段时间封闭，惯例五年，封闭期间不管大陆事务，各国常趁机开战。法蓝每十年办一次七国七龙排位战。\n- 北方集团：米兰帝国和盟国阿斯科利、佛罗、巴勒莫。米兰是大陆最强的人类国家，北面是极北荒原，边疆常驻五十万大军，龙骑兵大陆最强。皇帝是西尔维奥·贝鲁斯科尼（贝鲁斯科尼九世）。两位元帅马尔蒂尼（“米兰之盾”）和西多夫（“米兰之剑”，也叫“米兰之矛”）都是紫星龙骑将。三大家族：紫罗兰家族（马尔蒂尼）、月辉家族（月辉，米兰魔法师公会会长）、安切洛蒂家族（西多夫）。阿斯科利和佛罗都和极北荒原接壤。巴勒莫是“佣兵王国”，大陆最大的佣兵团都在那里。\n- 南方集团：蓝迪亚斯帝国和盟国波庞、波利。蓝迪亚斯和米兰实力相当，对立多年。约一百年前法蓝封闭时两国大战，米兰胜。皇帝马西莫·莫拉蒂，皇族自称黑凤凰的后裔。两国百年没有打过大仗，互相安插了大量间谍。只有米兰和蓝迪亚斯各有一个龙骑兵军团，所以只有这两国叫“帝国”，其余六国叫“王国”。\n- 阿卡迪亚王国：大陆东南端，最小、最弱、最热，全国魔法师三百来人，几百年没出过紫级，首都露娜城。从阿卡迪亚去米兰要穿过波庞王国。\n- 极北荒原：兽人的地方，占大陆四分之一以上，终年苦寒。三大部落：雷神部落（狮人为王族，酋长狮王古蒂，持超神器雷神之锤，兵力约四十万，最强）、所罗门部落（熊人）、战神部落（虎人），另有豹人、猿人、狼人、狐人、牛头人等，全军不低于二百万。部落的强弱看比蒙的数量。兽人不会耕种，每年秋天南下抢粮，入冬前撤回；米兰每年打“秋季保卫战”，指挥中心在北境的圣心城。兽人平时也和人类做交易。兽人祖训：紫晶比蒙一出现，就是所有兽人的主宰；三大部落强大以后不认这条。\n- 龙族：七大龙城。银龙城、黑龙城、金龙城是上位龙城，红、蓝、黄、绿四城是下位龙城。银龙城在米兰境内，和米兰合作。龙族总数不到一千，族规不许幼龙和人类签约。\n- 精灵：住在精灵大森林，月精灵最高贵，蓝精灵稀少。现任精灵女王是安琪。蓝精灵常被抓去当奴隶，在人类世界一名值十万金币以上。\n- 东龙八宗：东龙遗民藏在各国组成的隐藏势力，目标是夺回法蓝、复兴东龙。魔法四宗是琴（精神系分支）、棋（空间系分支，用黑白棋子布阵）、书（修综合元素，用毛笔形态的法杖写字施法）、画（召唤系，用画笔画召唤阵）；武技四宗是梅（剑法八十一式，重技巧）、兰（九式剑法，擅守，擅长医疗）、竹（傲竹剑法，攻守平衡）、菊（十八快剑）。八宗有三位太上长老、四位东龙护法长老和八位宗主。八宗的修炼等级每宗三种颜色，每色九阶，进度和彩虹等级的二十七阶一样，到紫色才和外界看不出区别。琴宗的琴魔法讲“境界”，大陆通行的神音魔法只看法力。\n\n【实力】\n- 魔法师和战士都按彩虹七色分级：赤、橙、黄、绿、青、蓝六色各分初阶、中阶、高阶，紫级分一至九阶。魔法师的称号依次是魔法师、中级魔法师、高级魔法师、大魔法师、魔导士、魔导师、大魔导师；战士是战士、中级战士、高级战士、大地战士、天空战士、战师、大战师。紫级之上是次神级（白级，一至九阶），除法蓝外几乎没人达到。魔法徽章和斗气的颜色就是等级。见面行礼时，魔法师弯腰，右手冒出一团代表自己等级颜色的元素。\n- 魔法系别：水、火、土、风、光明（治疗）、暗魔、精神、空间、召唤，另有冰、雷、金属等分支；亡灵魔法名声极坏。魔法师一生只能和一只魔兽签主从契约，只能召唤同级的魔兽，召唤系能越级召唤。至少紫级三阶才能用禁咒。同级较量时，战士打不过魔法师，因为魔法师有魔兽挡在前面。魔武双修很少见。\n- 神音师：精神系的分支，用乐器演奏施法，乐器以古琴、筝、琵琶、箫为主。曲子演奏到一半才生效，青级以上可以缩短；听得到就有效，可以配扩音法阵。法力只在演奏时增长，黄级以后全靠天赋，很难超过黄级，被人叫作“最高贵也最鸡肋”的魔法师，学的多是贵族小姐和公主。\n- 龙骑兵：人类最强的兵种，地位仅次于魔法师，要有骑士以上的贵族封号。军衔：小队长、银星龙骑将（青级，统领百人中队）、金星龙骑将（至少蓝级初阶，统领千人大队，座骑是真龙）、紫星龙骑将（紫级，统领万人军团）。\n- 魔兽分十阶，一到三阶是低级，四到六阶是高级，七阶以上是智慧魔兽，十阶是神兽；九阶魔兽和成年龙族能化成人形。兽人四大神兽是紫晶比蒙、战争巨兽、山岭巨人、金甲禁虫，紫晶比蒙为首，同一时间只有一只。比蒙：狂暴比蒙七阶，白银比蒙八阶，黄金比蒙九阶，紫晶比蒙十阶。\n- 物品等级：普器、精器、灵器、魂器、神器，之上是超神器。魂器和神器里有灵魂。\n\n【米兰魔武学院】\n- 在米兰城东门外，围墙和城墙连成一片，是仅次于法蓝的强者集中地。院长是精神系紫级四阶大魔导师弗格森，皇帝是名誉校长。学员来自各国，多是贵族。除皇族外都要考试；报名表填姓名、性别、年龄、修炼等级、出生地；报名费十金币，不退；学费一百金币一学期。交不起学费的穷学生可以当工读生，住条件差的混合区，工作自己找。学制五年，每周上三天课，每学期考试，不过就留级。校服红白相间，左胸有表示职业的印记（魔法师是六芒星，战士是长剑和盾，弓箭手是长弓）和表示年级的红白竖条，学员左胸戴魔法徽章。\n- 魔法部九个学系：精神、空间、召唤、暗魔、水、火、风、土、光明，精神、空间、召唤是传统三强。神音系挂在精神系下面，名义上是“第一系”，最盛时同时有九位各国公主在读；学员几乎全是女生，有自己的女生宿舍，神音师的身份最保密；系主任是妮娜。武技部有十七个学系，包括重剑战士系、重骑兵系（这两个是传统两强）、刺客系、剑师系、弓箭手系等。\n- 新生大赛：入学后不久举办。每个学系在系内选拔四名新生，加一名上一届的学长或学姐带队，五人一队。魔法部、武技部各打循环赛，各取前两名进决赛阶段：第一天两场半决赛，第二天休整，第三天决赛。比赛方式有三种：一对一五局三胜、五对五团战、擂台车轮战；哪一方女学员多，哪一方选方式，一样多就抽签。参赛者一般是赤级高阶到黄级初阶。可以认输，院长在场阻止伤亡；魔法师可以带契约魔兽，骑士系学员骑驯龙。冠亚季军三个系的十五名参赛学员免五年学费和宿舍费；主将从学院宝库挑奖品，冠军三件、亚军两件、季军一件。\n- 秋季保卫战：新生大赛后不久，学院挑一百名学员（战士六十、魔法师四十）随军历练，由重骑兵系五年级学员带队，学院不派老师，全听军队指挥，按惯例不执行危险任务。\n\n【社会】\n- 阶级：皇室、贵族（公、侯、伯、子、男爵，另有亲王）、平民、奴隶。几乎每座城都有奴隶市场。领主的私兵一般在三千人左右。\n- 货币：金币各国通用，一金币等于一百银币。一个普通家庭一个月开销十几个银币，一百金币是普通人家几年的开销；学生在米兰一个月生活费十金币以上。红宝石币只有大贵族用，一枚等于一百金币。\n- 佣兵团分 S、A、B、C、D、E、F、G 八级；升 D 级要有魔法师，S 级要有紫级强者。米兰城的佣兵总会只接 D 级以上的任务。\n- 米兰城：米兰首都，近六百万人口，常驻军三十万，从城北走到城南至少要三天，只有贵族能在城内骑魔兽。城里有佣兵总会、皇家图书馆、飘兰轩茶楼、金色生活饭店、大陆第一拍卖场。米兰靠近大陆北端，夏天舒适，初秋就有寒意。\n- 普利亚平原是米兰的粮仓。北境的布伦纳山脉海拔两千米以上，被当作天险，几乎不设防；山脉南侧有一座两万多人的小城科尼亚城，只有一条路通普利亚平原。\n\n【故事开始前】\n叶音竹是阿卡迪亚碧空海竹宗宗主叶离的孙子，从小跟琴宗宗主秦殇学琴。他八岁时，紫（紫晶比蒙，被兽人三大部落追杀，逃到南方）以紫发男孩的样子被他的琴声引来，此后天天来听琴，十年没有说过话。今年初夏，叶音竹离开碧空海去米兰，紫第一次开口，说要和他一起走。出发前，叶音竹在露娜城杀了来欺压魔法师公会的波庞蓝级魔导师鲁菲特等六人，公会把尸体处理掉了。两人穿过波庞王国北上，在波庞大道上，一百名铁甲重骑兵向两人冲锋，紫一声咆哮，重骑兵的坐骑同时人立而起，冲锋停住，队伍乱成一团。到了罗尔城，紫看到狮人后脸色大变，留下地图和面具，先走了。叶音竹在罗尔城把钱给了一个小乞丐，小乞丐偷走了他的空间戒指（里面有琴宗五大名琴、秦殇写的介绍信和钱），这个小乞丐是苏拉。叶音竹以赤级魔法师的身份加入 E 级铁荆棘佣兵团，护送女商人安雅北上，路上顶撞了强买角马的银星龙骑将奥斯丁，安雅出面解围。\n故事开始这一天是夏末，叶音竹刚到米兰城，这一天是米兰魔武学院招生报名的最后一天。\n同一时间，蓝迪亚斯皇帝马西莫派蓝袍人埃莫森给兽人雷神部落出主意、送空间戒指。今年秋天，雷神部落要派一支劫掠军团翻越布伦纳山脉，偷袭米兰的粮仓普利亚平原。\n\n【主角】\n主角是女性。她的出身、起点、职业方向、天赋每一局都不一样，见【主角身世】和主角状态。她开局能接触到哪些人和事，由她的起点决定。",
 "rules": "1. 原著事件照常推进。主角不在场时，原著里的事件照原样发生（被主角改变过的除外），主角可以通过传闻、公告或别人转述知道。主角在场时，她的选择可以改变事件的过程和结果。\n2. 叶音竹和其他人一样受这个世界的规则约束。他琴艺和修炼天赋很高，从没出过碧空海，不懂钱、贵族的规矩和人情世故。他做事靠实力、准备和别人的帮助，要付出代价，判断失误时会失败。别人对他的看法取决于和他打过的交道。\n3. 叶音竹和紫从小一起长大，是兄弟，彼此完全信任。紫话极少，对别人冷淡；谁伤害叶音竹，他会下重手。\n4. 女性角色各有自己的目标。苏拉要为母亲和弟弟报仇、拿回属于自己的东西，同时替生父马西莫查探米兰。海洋自尊心极强，想让人看重她的琴艺。香鸾是米兰公主，想在联姻之外为自己和米兰做事。安雅要查清母亲的死因、夺回精灵族。妮娜想证明神音师能成为最强的魔法师。罗兰想赢过所有同龄人。月冥想让冥雪长大，想证明暗魔系。她们之间，以及她们和主角之间，可以相识、较量、合作，成为关系很深的朋友或姐妹。\n5. 实力体系前后一致。等级按彩虹等级计算，越级战斗要付出代价；紫级强者的实力远在学生之上，学生打不过紫级强者。神音师的曲子演奏到一半才生效。主角的成长合理，升一阶要时间和积累。\n6. 很多人的身份是保密的：香鸾的公主身份、苏拉的女儿身和蓝迪亚斯公主身份、费斯切拉的王子身份、马良和常昊的东龙八宗身份、妮娜的真实实力和监察官身份、西多夫的东龙护法长老身份、海洋的东龙皇室血脉、叶音竹的真实实力。谁知道什么、谁不知道什么，前后要一致，秘密由剧情揭开。\n7. 称呼：皇帝、国王称“陛下”；王子、公主称“殿下”，长公主称“长公主殿下”；贵族、官员、军官称“某某大人”，会长等称“某某阁下”；高阶魔法师称“某某大师”；法蓝塔主称“圣魔导师大人”；学院里称“院长”“主任”“老师”“学长”“学姐”；贵族子女称“小姐”“少爷”，未婚女性不论年纪都称“小姐”；兽人称“酋长大人”；东龙八宗称“宗主”“太上长老”“长老”。晚辈常用亲属称谓叫亲近的长辈，例如“秦爷爷”。\n8. 没有重要事件的时候，可以用一两句话跳过几周到几个月，让主线按原著的时间往前走。\n9. 战斗时交代双方的等级、用的魔法或武技、契约魔兽，以及双方各自怎么应对。神音师演奏时交代乐器、曲子和效果。\n10. 人物的外貌按人物卡交代发色、衣着和气质，男女一样。",

 "intro": "你是合欢宗的弟子，修情道。修为靠真心经历爱、恨和失去来提升。\n正道把合欢宗当作邪门，魔道也看不上合欢宗。你有自己的是非标准，世上的规矩，你按自己的需要取舍。\n每次开新档，你的来历、灵根和起点都会重新抽取。",
 "world": "【世界】\n- 修仙界分正道、魔道和中间势力。正道以天衡剑宗、大觉寺和几个修仙世家为首；魔道以幽冥魔宗为首；合欢宗、万宝楼和各地散修在中间。凡人王朝在山下，修仙者很少过问凡人王朝的事。\n- 境界：炼气（一到九层）→ 筑基 → 金丹 → 元婴 → 化神 → 合体 → 大乘 → 渡劫。炼气以上每个大境界分初期、中期、后期、圆满。突破大境界要闭关，可能失败受伤。\n- 灵根决定修炼的快慢：单一属性的天灵根最快，双灵根次之，三灵根、四灵根慢，五行俱全的伪灵根最慢。也有冰、雷、风等变异灵根，修炼快，适合的功法少见。\n- 寿元：凡人七八十岁，炼气一百二十岁，筑基两百岁，金丹五百岁，元婴一千岁，化神两三千岁。寿元将尽还没突破，就会坐化。修士看起来比实际年纪年轻得多，金丹以上的人外貌常常停在二三十岁的样子。\n- 修仙者用灵石交易。本剧本里的“灵石”按下品灵石计数，一块中品等于一百块下品。\n\n【合欢宗】\n- 宗门在南方的桃花谷，宗主是化神期的绛雪真君。弟子大多是女子，也有少数男弟子。\n- 合欢宗的心法是《合欢问情诀》，修的是情道：人有七情（喜、怒、哀、惧、爱、恶、欲），每一种情真正经历过、看明白了，修为就会上涨。涨多少取决于这份情的真假和深浅；假装出来的情不涨修为。\n- 双修是合欢宗的法门之一：两人神魂相交，双方的修为都有长进。情道修为主要来自动心，双修是其中一种途径。\n- 外人认为合欢宗靠采补害人。宗门里确实出过采补害人的弟子，正道因此一直想找机会清剿合欢宗。\n- 宗门的规矩只有两条：不出卖同门，不外传心法。其他事宗门不管，弟子各凭本事。\n\n【主角】\n主角是合欢宗的女弟子，修情道。她有自己的是非标准，不按世俗的道德行事。对待规则以自己的需要为准，也会利用规则达到自己的目的。她对感情很随性，真心和欺骗都有可能，爱得久也可能随时离开。她的来历、灵根和起点每一局都不一样，见【主角身世】和主角状态。\n\n【故事开始时的局势】\n- 桃花谷附近的青石镇，接连有年轻男子精气枯竭而死，人们怀疑是合欢宗的人干的。\n- 天衡剑宗首席弟子沈清砚和戒律堂执事谢无霜奉命来查这桩案子，已经到了青石镇。\n- 幽冥魔宗少主夜阑在找一件能压住魔功反噬的东西，传闻这件东西和合欢宗有关。\n- 绛雪真君准备闭关冲击合体期，宗门事务暂时交给几位长老。\n- 大觉寺的佛子了尘下山游历，正一路往南走。",
 "rules": "1. 情道修为：主角真正经历并看明白一种情的时候，在 stats 里给修为进度加 5～20（按这份情的深浅定），并把这种情写进“七情已悟”。修为进度到 100，可以尝试突破小境界，突破后进度从 0 开始。大境界要闭关。\n2. 每个人物是否动心、动心以后怎么选择，由各自的性格、立场和处境决定。感情线的走向包括小甜蜜和恨海情天，立场对立、误会、背叛、生离死别都可能发生。\n3. 修为和寿元的差距在剧情中始终起作用：凡人会衰老、死去；主角闭关一次，外面可能已经过去十几年。\n4. 正道、魔道和合欢宗之间的冲突一直在推进，主角不在场时也会发生，主角可以通过传闻和同门得知。\n5. 称呼按修仙界的习惯：同门按入门先后称师姐、师兄、师妹、师弟；长辈称真人、真君、长老；正道的人常叫合欢宗女弟子“妖女”，熟了才叫名字。\n6. 斗法时交代双方的境界、用的法宝和法术的效果。",

 "intro": "大胤仙朝立国一千二百年。仙帝闭关八十年，没有出关。太子三年前走火入魔身亡，死因不明，储位一直空着。长公主摄政，几位皇子在争夺储位，三大宗门、四大世家都在选择支持哪一方。\n你不是皇族，没有现成的靠山，要靠自己在各方势力之间寻找盟友，决定投靠哪一方，或者拉拢别人为自己做事。\n每一次开新档，你的出身、灵根和进京的方式都会重新抽取。",
 "world": "【大胤仙朝】\n- 中州由大胤仙朝统治，皇族姬氏世代修仙。仙帝姬承渊是渡劫期修士，八十年前闭关，至今没有出关。\n- 太子姬昭三年前走火入魔身亡，死因没有查清。储位一直空着，长公主姬晚照以摄政的名义掌管朝政。\n- 朝廷设三省六部，官员大多是修士，凡人只能做底层的吏员。俸禄按灵石发。\n- 三大宗门：天剑宗（剑修，和萧家、二皇子走得近）、丹鼎宗（炼丹，丹药卖给各方，不得罪任何一方）、天机阁（推演天机，替皇室观星，暗中也在为本阁挑选要支持的一方）。\n- 四大世家：苏、萧、裴、秦，各自占有一州的灵脉，和皇族世代联姻。\n- 北境有妖族，由镇北侯萧衡率边军镇守。\n- 境界：炼气（一到九层）→ 筑基 → 金丹 → 元婴 → 化神 → 合体 → 大乘 → 渡劫。炼气以上每个大境界分初期、中期、后期、圆满。突破大境界要闭关，可能失败受伤。\n- 灵根决定修炼的快慢：单一属性的天灵根最快，双灵根次之，三灵根、四灵根慢，五行俱全的伪灵根最慢。也有冰、雷、风等变异灵根，修炼快，适合的功法少见。\n- 寿元：凡人七八十岁，炼气一百二十岁，筑基两百岁，金丹五百岁，元婴一千岁，化神两三千岁。寿元将尽还没突破，就会坐化。修士看起来比实际年纪年轻得多，金丹以上的人外貌常常停在二三十岁的样子。\n- 京城最大的情报组织是“听雨楼”，外人不知道它背后的主人是谁。\n\n【故事开始时的局势】\n- 长公主摄政已经三年，想成为大胤第一位女帝，朝中老臣反对。\n- 二皇子姬渊平日饮酒作诗，京城的人都把他当作闲散王爷。他暗中联络天剑宗和萧家。\n- 天机阁主谢无咎放出一句谶语：“帝星将陨，紫微易主。”各方都在猜这句话指的是谁。\n- 守在仙帝闭关洞府外的禁军，三年里换了三任统领。\n- 今年的女官试即将开考。女官试是寒门女修进入朝堂的正途。\n\n【主角】\n主角是一名女修，不属于皇族。她的出身、灵根和进京的方式每一局不一样（见【主角身世】和主角状态）。她在夺嫡之争里没有现成的靠山，要自己寻找盟友，和各方交换利益和情报，决定支持哪一方。",
 "rules": "1. 每个势力都有自己的目标。人物做决定时先考虑利益，有时也会因为感情和道义改变决定。\n2. 情报是最重要的资源。谁知道什么、谁不知道什么，前后要一致。主角得到情报、交换把柄时，写清楚来源。\n3. 主角的“班底”是真正站在她这边的人，通过交情、利益或把柄得来。有人加入或背叛时，在 stats 里更新班底。主角拿到别人的把柄时，写进“手里的把柄”。\n4. 朝堂上的事情会自行推进：主角不在场时，各方照样行动，主角可以从邸报、传闻和眼线那里得知。\n5. 称呼按朝堂的规矩：长公主称“殿下”；皇子按封号称“安王殿下”等；官员按官职称“某大人”；宗门中人称“真人”“阁主”；世家子弟称“某公子”“某小姐”。\n6. 朝堂、宴席、密室里的场景，交代在场有谁、各自坐在什么位置。斗法时交代双方的境界和用的法宝。",

function normalizeScript(raw) {

  s.title = str(s.title); if (!s.title) errors.push('缺少标题 title');
  s.world = str(s.world); if (!s.world) errors.push('缺少剧本正文 world');
  s.intro = str(s.intro); s.rules = str(s.rules); s.style = str(s.style); s.author = str(s.author); s.persona = str(s.persona);
  s.tags = Array.isArray(s.tags) ? s.tags.map(str).filter(Boolean) : [];
  s.relationLabels = Object.assign({ friendliness: '好感', affection: '心动' }, s.relationLabels || {});
  s.stats = Array.isArray(s.stats) ? s.stats.filter(x => x && x.key).map(x => ({ ...x, key: str(x.key), label: str(x.label) || str(x.key), type: x.type === 'text' ? 'text' : 'number' })) : [];
  if (!s.stats.find(x => x.key === 'name')) s.stats.unshift({ key: 'name', label: '姓名', type: 'text', ask: true, initial: '' });
  ensureGenderStat(s);
  const keys = new Set(); for (const x of s.stats) { if (keys.has(x.key)) errors.push('属性 key 重复：' + x.key); keys.add(x.key); }
  s.characters = Array.isArray(s.characters) ? s.characters.filter(c => c && str(c.name)) : [];
  s.objectives = Array.isArray(s.objectives) ? s.objectives.filter(o => o && str(o.title)) : [];
  s.items = Array.isArray(s.items) ? s.items.filter(i => i && str(i.name)) : [];
  s.openingChoices = Array.isArray(s.openingChoices) ? s.openingChoices.map(str).filter(Boolean) : [];
  s.opening = str(s.opening); s.stage = str(s.stage); s.openingGuide = str(s.openingGuide);
  if (s.creation && typeof s.creation === 'object') {
    s.creation.ai = !!s.creation.ai; s.creation.aiGuide = str(s.creation.aiGuide);
    s.creation.names = Array.isArray(s.creation.names) ? s.creation.names.map(str).filter(Boolean) : [];

  s.openingSeeds = Array.isArray(s.openingSeeds) ? s.openingSeeds.map(str).filter(Boolean) : [];

  s.traitSeeds = Array.isArray(s.traitSeeds) ? s.traitSeeds.map(str).filter(Boolean) : []; // 剧本自己的随机潜质，和引擎的通用潜质一起抽
  s.charStats = (Array.isArray(s.charStats) ? s.charStats : []).filter(x => x && str(x.key) && !['name', 'gender', 'age', 'born'].includes(str(x.key)))
    .map(x => ({ key: str(x.key), label: str(x.label) || str(x.key), type: x.type === 'number' ? 'number' : 'text', ...(x.min !== undefined ? { min: num(x.min) } : {}), ...(x.max !== undefined ? { max: num(x.max) } : {}), ...(str(x.hint) ? { hint: str(x.hint) } : {}) }));

/* 把“十九岁”“三百岁”“19”这类写法读成数字；读不出来返回 null */
function ageNum(v) {

  const s = String(v ?? '').trim(); if (!s) return null;
  const d = s.match(/-?\d+/); if (d) return +d[0];
  const t = s.match(/[零〇一二两三四五六七八九十百千万]+/); if (!t) return null;
  const D = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 }, U = { 十: 10, 百: 100, 千: 1000 };

    else { total += (section + digit || 1) * 10000; section = 0; digit = 0; } // 万
  }
  return total + section + digit;
}

function timelineText(save) {

  const lines = [];
  let upcomingShown = 0;
  for (const m of ms) {
    const t = T[m.id] || {};
    if (t.status === 'done') lines.push(`✓ [${m.id}] ${m.title} —— 本档实际：${t.outcome || '已按原著发生'}`);
    else if (t.status === 'active') lines.push(`▶ [${m.id}] ${m.title}（进行中）\n   原著：${m.canon}${m.hook ? `\n   主角可能的切入：${m.hook}` : ''}`);
    else if (upcomingShown < 2) { upcomingShown++; lines.push(`○ [${m.id}] ${m.title}（尚未到来）\n   原著：${m.canon}${m.hook ? `\n   主角可能的切入：${m.hook}` : ''}`); }

  }

}

async function chatStream(messages, { onText, onThinking, signal }) {
  if (!S.apiKey) throw new Error('还没有填写 API 密钥，请先到设置里填写。');
  const res = await fetch(apiUrl(), {
    method: 'POST', signal,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.apiKey },
    body: JSON.stringify(apiBody({ messages, stream: true, stream_options: { include_usage: true } }, { helper: false })),
  });
  if (!res.ok) throw await apiError(res);
  // 个别服务即使要求流式也会直接返回 JSON
  if ((res.headers.get('content-type') || '').includes('application/json')) {
    const j = await res.json();
    const m = j.choices?.[0]?.message || {};
    if (!str(m.content)) throw new Error(explainEmpty(str(m.reasoning_content).length, j.choices?.[0]?.finish_reason, ''));
    onText && onText(m.content);
    return { text: m.content, usage: j.usage, raw: m.content };
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', usage = null, reasoning = '', finish = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (!data || data === '[DONE]') continue;
      let j; try { j = JSON.parse(data); } catch { continue; }
      if (j.error) throw new Error(j.error.message || '接口返回错误');
      const d = j.choices?.[0]?.delta;
      if (d?.content) { text += d.content; onText && onText(text); }
      if (d?.reasoning_content) { reasoning += d.reasoning_content; onThinking && onThinking(reasoning.length); }
      if (j.choices?.[0]?.finish_reason) finish = j.choices[0].finish_reason;
      if (j.usage) usage = j.usage;
    }
  }
  if (!text.trim()) { const e = new Error(explainEmpty(reasoning.length, finish, buf)); e.raw = reasoning ? '（思考过程）\n' + reasoning.slice(-3000) : buf.slice(0, 3000); throw e; }

}
function explainEmpty(reasoningLen, finish, leftover) {
  if (reasoningLen > 0) return S.thinking === 'enabled'
    ? `AI 思考了 ${reasoningLen} 字，但还没来得及写正文${finish === 'length' ? '，输出额度就用完了' : '就结束了'}。\n可以直接重试；如果反复出现，到设置里把“单次最多输出 tokens”调大（现在是 ${S.maxTokens}），或者把思考强度调低一档。`
    : `AI 只输出了“思考过程”，没有写出正文${finish === 'length' ? '，输出额度在思考阶段就用完了' : ''}。\n你选了关闭思考模式，但这个服务似乎没有关掉。可以到设置里把思考模式改成“开启”，或把“单次最多输出 tokens”调大。`;
  if (finish === 'length') return 'AI 还没写出正文就达到了输出上限，请到设置里把“单次最多输出 tokens”调大。';
  if (finish === 'content_filter') return 'AI 的回复被服务商的内容审核拦截了，可以换个说法重试。';

}

function visibleNarrative(text) {

  // 流式时隐藏可能是标记开头的尾巴
  for (let k = Math.min(STATE_MARK.length - 1, text.length); k > 0; k--) if (STATE_MARK.startsWith(text.slice(-k))) return text.slice(0, -k);
  return text;
}
function parseLooseJSON(s) {
  if (!s) return null;
  let t = s.replace(/```(?:json)?/gi, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  t = t.slice(a, b + 1);
  const tries = [
    x => x,
    x => x.replace(/,\s*([}\]])/g, '$1'),
    x => x.replace(/,\s*([}\]])/g, '$1').replace(/:\s*\+(\d)/g, ': $1').replace(/[“”]/g, '"').replace(/\/\/[^\n]*/g, ''),
  ];
  for (const f of tries) { try { return JSON.parse(f(t)); } catch {} }
  return null;
}
function splitOutput(text) {
  const i = text.indexOf(STATE_MARK);
  if (i < 0) {
    // 容错：模型忘了标记但在末尾给了 JSON
    const m = text.match(/\n\s*(```json)?\s*(\{[\s\S]*"choices"[\s\S]*\})\s*(```)?\s*$/);
    if (m) return { narrative: text.slice(0, m.index).trim(), delta: parseLooseJSON(m[2]), hadMark: false };
    return { narrative: text.trim(), delta: null, hadMark: false };
  }
  return { narrative: text.slice(0, i).trim(), delta: parseLooseJSON(text.slice(i + STATE_MARK.length)), hadMark: true };
}
/* 兼容各种写法的选项：字符串、对象、带编号的文本 */
function normalizeChoices(raw) {

function applyReveal(c, reveal, turn, chips) {

  }
  // 人物
  if (Array.isArray(delta.characters)) {
    for (const cd of delta.characters) {
      if (!cd || !str(cd.name)) continue;
      if (str(cd.name) === playerName(save)) continue;
      let c = findChar(st.characters, cd.name);
      if (!c) {
        if (!cd.new && !cd.identity && !cd.brief && !cd.personality) continue;
        const inner = cd.inner && typeof cd.inner === 'object' ? cd.inner : {};
        c = makeCharacter({ ...cd, stats: pickCharStats(sc, cd.stats), born: undefined, motive: cd.motive || inner.motive, backstory: cd.backstory || inner.backstory, secret: cd.secret || inner.secret, traits: [], seeds: [], friendliness: cd.friendliness ?? 50, affection: cd.affection ?? 0 }, turn, st.year);
        dealSeeds([c], sc, usedSeeds(st));
        if (cd.note) c.notes.push({ turn, text: str(cd.note) });
        applyReveal(c, cd.reveal, turn, chips);
        st.characters.push(c);
        chips.push({ t: `结识 ${c.name}`, c: 'ch' });
        continue;
      }
      if (c.met === false && meetsPlayer(cd)) { c.met = true; chips.push({ t: `结识 ${c.name}`, c: 'ch' }); }
      if (cd.new) { // 已存在却标记为新：当作补充信息
        for (const f of ['identity', 'appearance', 'personality', 'brief']) if (!c[f] && str(cd[f])) c[f] = str(cd[f]);
      }
      for (const [f, lab, cls] of [['friendliness', L.friendliness, ''], ['affection', L.affection, 'af']]) {
        if (cd[f] === undefined || cd.new) continue;
        const d = num(cd[f], 0); if (!d) continue;
        const before = c[f]; c[f] = clamp(before + d, 0, 100);
        const real = Math.round(c[f] - before);
        if (real) chips.push({ t: `${c.name} ${lab}${real > 0 ? '+' : ''}${real}`, c: cls || (real > 0 ? 'up' : 'down') });
      }
      for (const f of ['opinion', 'relation', 'status', 'identity', 'appearance', 'address']) if (str(cd[f])) c[f] = str(cd[f]);
      if (str(cd.gender) && !str(c.gender)) c.gender = str(cd.gender);
      if (cd.age !== undefined && (c.born === null || c.born === undefined)) { const a = ageNum(cd.age); if (a !== null) c.born = st.year - a; }
      mergeCharStats(sc, c, cd.stats, chips);
      if (['major', 'supporting', 'minor'].includes(cd.importance)) {
        c.importance = cd.importance;
        if (!(c.seeds || []).length) dealSeeds([c], sc, usedSeeds(st)); // 路人升成重要人物，补上潜质
      }
      if (str(cd.now)) c.now = str(cd.now);
      if (str(cd.note)) c.notes.push({ turn, text: str(cd.note) });
      const inner = cd.inner && typeof cd.inner === 'object' ? cd.inner : {};
      for (const f of ['motive', 'backstory', 'secret']) { const v = str(inner[f] || (cd.new ? cd[f] : '')); if (v && !c[f]) c[f] = v; }
      applySeeds(c, cd.seeds || inner.seeds);
      applyReveal(c, cd.reveal, turn, chips);
      c.lastTurn = turn;
    }
  }
  // 事件
  if (Array.isArray(delta.events)) {
    for (const e of delta.events) {
      if (!e || !str(e.title)) continue;
      if (st.events.find(x => x.title === str(e.title) && !x.resolved)) continue;
      st.events.push({ id: uid(), turn, title: str(e.title), description: str(e.description), characters: Array.isArray(e.characters) ? e.characters.map(str).filter(Boolean) : [], consequence: str(e.consequence), weight: e.weight === 'major' ? 'major' : 'minor', resolved: false });
      chips.push({ t: `事件：${str(e.title)}`, c: 'ev' });
    }
  }
  if (Array.isArray(delta.resolved)) {
    for (const r of delta.resolved) {
      const t = str(r); if (!t) continue;
      const ev = st.events.find(x => !x.resolved && x.title === t) || st.events.find(x => !x.resolved && (x.title.includes(t) || t.includes(x.title)));
      if (ev) { ev.resolved = true; ev.resolvedTurn = turn; chips.push({ t: `了结：${ev.title}` }); }
    }
  }
  // 目标
  if (Array.isArray(delta.objectives)) {
    for (const o of delta.objectives) {
      if (!o || !str(o.title)) continue;
      let ob = st.objectives.find(x => x.title === str(o.title)) || st.objectives.find(x => x.title.includes(str(o.title)) || str(o.title).includes(x.title));
      if (!ob) {
        ob = { id: uid(), title: str(o.title), description: str(o.description), status: 'active', progress: 0, turn };
        st.objectives.push(ob); chips.push({ t: `新目标：${ob.title}`, c: 'ch' });
      }
      if (o.progress !== undefined) ob.progress = clamp(num(o.progress, ob.progress), 0, 100);
      if (str(o.description) && !ob.description) ob.description = str(o.description);
      if (['completed', 'failed', 'active'].includes(o.status) && o.status !== ob.status) {
        ob.status = o.status;
        if (o.status === 'completed') { ob.progress = 100; chips.push({ t: `完成：${ob.title}`, c: 'up' }); }
        if (o.status === 'failed') chips.push({ t: `失败：${ob.title}`, c: 'down' });
      }
    }
  }
  // 主线时间线与蝴蝶效应（只给 AI 的备忘，不显示）
  if (Array.isArray(delta.milestones) && (sc.milestones || []).length) {
    st.timeline = st.timeline || {};
    for (const m of delta.milestones) {
      if (!m) continue;
      const def = sc.milestones.find(x => x.id === str(m.id)) || sc.milestones.find(x => x.title === str(m.title || m.id));
      if (!def || !['active', 'done'].includes(m.status)) continue;
      const cur = st.timeline[def.id] || {};
      st.timeline[def.id] = { status: m.status, outcome: str(m.outcome) || cur.outcome || '', turn: cur.turn ?? turn, endTurn: m.status === 'done' ? turn : undefined };
    }
  }
  if (Array.isArray(delta.butterflies)) {
    st.butterflies = st.butterflies || [];
    for (const b of delta.butterflies) {
      const text = str(typeof b === 'string' ? b : b && b.text); if (!text) continue;
      if (st.butterflies.find(x => x.text === text)) continue;
      st.butterflies.push({ turn, text, canon: str(b && b.canon), ripple: str(b && b.ripple) });
    }
  }
  // 物品
  if (delta.items && typeof delta.items === 'object') {
    for (const it of (Array.isArray(delta.items.add) ? delta.items.add : [])) {
      if (!it || !str(it.name)) continue;
      const cnt = Math.max(1, num(it.count, 1));
      const ex = st.items.find(x => x.name === str(it.name));
      if (ex) { ex.count += cnt; if (str(it.desc)) ex.desc = str(it.desc); } else st.items.push({ name: str(it.name), desc: str(it.desc), count: cnt });
      chips.push({ t: `获得 ${str(it.name)}${cnt > 1 ? '×' + cnt : ''}`, c: 'up' });
    }
    for (const it of (Array.isArray(delta.items.remove) ? delta.items.remove : [])) {
      const name = typeof it === 'string' ? it : str(it && it.name); if (!name) continue;
      const ex = st.items.find(x => x.name === name); if (!ex) continue;
      ex.count -= Math.max(1, num(it && it.count, 1));
      if (ex.count <= 0) st.items.splice(st.items.indexOf(ex), 1);
      chips.push({ t: `失去 ${name}`, c: 'down' });
    }
  }
  return chips;
}

/* ---------------- 游戏循环 ---------------- */
const G = { save: null, busy: false, abort: null, stream: null, error: null, summarizing: false };

function pushSnapshot(save, turn) {
  const snap = clone(save.state);
  save.snapshots = (save.snapshots || []).filter(s => s.turn < turn);
  save.snapshots.push({ turn, state: snap, logLen: save.log.length });
  const lim = Math.max(1, S.snapshotLimit | 0, S.rewindTurns | 0);
  if (save.snapshots.length > lim) save.snapshots = save.snapshots.slice(-lim);
}

async function playTurn(action) {
  const save = G.save;
  if (!save || G.busy) return;
  action = str(action);
  if (!action) return;
  G.busy = true; G.error = null;
  const turn = save.state.turn + 1;
  G.stream = { action, text: '', thinking: false, rc: 0, t0: Date.now() };
  renderLog(); setComposerBusy(true); scrollLogToEnd(true);
  const messages = [{ role: 'system', content: buildSystemPrompt(save) }, { role: 'user', content: buildUserPrompt(save, action) }];
  G.abort = new AbortController();
  let result;
  try {
    result = await chatStream(messages, {
      signal: G.abort.signal,
      onText: t => { G.stream.text = t; G.stream.thinking = false; updateStreamView(); },
      onThinking: n => { G.stream.thinking = true; G.stream.rc = n; updateStreamView(); },
    });
  } catch (e) {
    const aborted = e.name === 'AbortError';
    G.busy = false; G.abort = null;
    const partial = G.stream?.text || '';
    G.stream = null;
    if (aborted) {
      $('#action').value = action;
      toast(partial ? '已停止，本回合没有保存' : '已停止');
    } else {
      G.error = { message: e.message || String(e), action, raw: e.raw };
    }
    renderLog(); setComposerBusy(false); scrollLogToEnd();
    return;
  }
  addUsage(save, result.usage);
  const { narrative, delta, hadMark } = splitOutput(result.text);
  if (!narrative) {
    G.busy = false; G.stream = null; G.error = { message: 'AI 没有写出剧情正文，可以重试。', action, raw: result.text };
    renderLog(); setComposerBusy(false); await saveSettings(); return;
  }
  pushSnapshot(save, turn);
  const yearBefore = save.state.year;
  const chips = applyDelta(save, delta, turn);
  const warns = [];
  if (!delta) warns.push(hadMark ? '状态更新的格式有误，本回合属性和人物没有变化。' : 'AI 没有按格式返回状态更新，本回合属性和人物没有变化。');
  const choices = choicesOf(delta);
  save.state.turn = turn;
  const entry = { id: uid(), turn, action, narrative, choices, chips, warns, at: Date.now(), ...(delta ? {} : { raw: result.text.slice(-4000) }) };
  if (save.state.year - yearBefore >= 2) entry.evolve = { from: yearBefore, to: save.state.year, status: 'pending' };
  save.log.push(entry);
  G.busy = false; G.stream = null; G.abort = null;
  await persist(save); await saveSettings();
  renderLog(); renderGameHeader(); setComposerBusy(false); scrollToEntryStart();
  if (!choices.length) fillChoices(entry);
  if (entry.evolve) await evolveAfterSkip(save, entry);
  maybeSummarize();
}

function needSummary(save) {
  const st = save.state;
  const unsum = save.log.filter(e => e.turn > st.summarizedUpTo && e.turn <= st.turn).length;
  return unsum >= S.recentTurns + S.summaryInterval;
}
async function maybeSummarize(force = false) {
  const save = G.save;
  if (!save || G.summarizing) return;
  if (!force && !needSummary(save)) return;
  const st = save.state;
  const pending = save.log.filter(e => e.turn > st.summarizedUpTo && e.turn <= st.turn);
  const keep = force ? 0 : S.recentTurns;
  const target = pending.slice(0, Math.max(0, pending.length - keep));
  if (!target.length) { if (force) toast('没有需要总结的新剧情'); return; }
  const upTo = target[target.length - 1].turn, upToId = target[target.length - 1].id, saveId = save.id;
  G.summarizing = true; renderGameHeader();
  try {
    const text = await summarizeTurns(save, target);
    const cur = G.save;
    const still = cur && cur.id === saveId && cur.log.find(e => e.turn === upTo)?.id === upToId && cur.state.summarizedUpTo < upTo;
    if (still && text) {
      cur.state.memory = text; cur.state.summarizedUpTo = upTo; cur.state.memoryAt = Date.now();
      await persist(cur); await saveSettings();
      if (force) toast('剧情摘要已更新');
      if (!$('#sheet').hidden && sheetTab === 'memory') renderSheet();
    }
  } catch (e) {
    console.warn('摘要失败', e);
    if (force) toast('摘要失败：' + (e.message || e).toString().slice(0, 60));
  } finally { G.summarizing = false; renderGameHeader(); }
}
async function summarizeTurns(save, entries) {
  const st = save.state, sc = save.script;
  const chars = st.characters.map(c => `${c.name}（${c.relation || c.identity || ''}，${sc.relationLabels.friendliness}${Math.round(c.friendliness)}/${sc.relationLabels.affection}${Math.round(c.affection)}，${c.status}）`).join('、');
  const evs = st.events.map(e => `${e.resolved ? '[已了结]' : '[未了结]'}${e.title}`).join('；');
  const messages = [
    { role: 'system', content: '你是长篇互动小说的剧情记录员，负责维护一份“剧情摘要”，供作者续写时回顾前情。你只输出摘要正文。' },
    { role: 'user', content: `剧本：${sc.title}　主角：${playerName(save)}　现在：${yearLabel(sc, st.year)}

【旧的剧情摘要】
${st.memory || '（暂无，这是第一次总结）'}

【需要并入摘要的新剧情】
${entries.map(e => `〔第${e.turn}回合〕${e.action ? '玩家行动：' + e.action + '\n' : ''}${e.narrative}`).join('\n\n')}

【参考：当前人物】${chars || '无'}
【参考：关键事件】${evs || '无'}

请把新剧情并入旧摘要，写一份更新后的完整剧情摘要：
1. 按时间顺序，用年份和“第X回合前后”标注大致位置；越早的剧情写得越概括，最近的写得具体一些。
2. 保留已经发生的重要事实和转折、人物之间的承诺、约定、欠下的人情、谎言和秘密（写明谁知道、谁不知道）、埋下的伏笔、还没解决的问题、主角做过的关键选择。
3. 只记事实。
4. 最后单独一段写“当前局势”：主角此刻在哪、和谁在一起、正在做什么、面临什么。
5. 总长度在 ${S.memoryMaxChars} 字以内，直接从摘要正文写起。` },
  ];
  const r = await chatOnce(messages, { temperature: 0.3, maxTokens: Math.ceil(S.memoryMaxChars * 1.6) + 200 });
  addUsage(save, r.usage);
  return str(r.text).replace(/^```\w*\n?|```$/g, '').trim();
}

/* ---------------- 开场随机情境：每次开场重新抽一组，让每一局的开头都不一样 ---------------- */
const OPENING_TIMES = ['清晨', '上午', '正午', '午后', '黄昏', '入夜', '深夜', '下雨天', '刮大风的一天', '节日前一天'];
const OPENING_TONES = ['轻松', '紧张', '悬疑', '温情', '尴尬', '滑稽', '压抑', '热闹'];
const OPENING_SITUATIONS = ['一件日常小事出了岔子', '收到一封意外的信或口信', '在人群里撞见一个不该出现在这里的人', '被临时派了一件麻烦差事', '一场小误会', '有人上门求助', '丢了一样重要的东西', '在路上遇到意外', '被卷进别人的争执', '平静的时候被人打断', '无意中听到一段对话', '身体出了点状况', '家人或旧识的消息', '钱的麻烦', '一笔交易', '有人冒名顶替'];
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
function openingSeed(save) {
  const own = save.script.openingSeeds || [];
  const situation = own.length && Math.random() < 0.7 ? pickOne(own) : pickOne(OPENING_SITUATIONS);
  return { time: pickOne(OPENING_TIMES), situation, tone: pickOne(OPENING_TONES) };
}
async function startOpening(save) {
  const sc = save.script;
  if (sc.opening) {
    const nm = playerName(save);
    save.log.push({ id: uid(), turn: 0, action: '', narrative: sc.opening.replaceAll('{name}', nm), choices: sc.openingChoices.map(c => c.replaceAll('{name}', nm)), chips: [], warns: [], at: Date.now() });
    await persist(save); renderLog(); return;
  }
  // 无开场白：让 AI 写开场，算作第 0 回合
  G.busy = true; G.error = null; G.stream = { action: '', text: '', thinking: false, rc: 0, t0: Date.now() }; renderLog(); setComposerBusy(true);
  G.abort = new AbortController();
  if (!(save.snapshots || []).find(x => x.turn === 0)) pushSnapshot(save, 0); // 留一份开场前的状态，方便重新生成开场
  const seed = sc.openingRandom === false ? null : openingSeed(save);
  const guide = `${seed ? `\n这次开场的情境（随机抽到的，细节按主角的身份和所在地来定）：时间：${seed.time}；情境：${seed.situation}；基调：${seed.tone}。` : ''}${save.state.openingGuide ? `\n${save.state.openingGuide}` : ''}`;
  const messages = [{ role: 'system', content: buildSystemPrompt(save) }, { role: 'user', content: buildUserPrompt(save, `（游戏开始。请写开场：交代主角此刻所处的场景与处境，引出第一个需要玩家做决定的时刻。）${guide}`).replace(/第 1 回合/, '开场') }];
  try {
    const r = await chatStream(messages, { signal: G.abort.signal, onText: t => { G.stream.text = t; G.stream.thinking = false; updateStreamView(); }, onThinking: n => { G.stream.thinking = true; G.stream.rc = n; updateStreamView(); } });
    addUsage(save, r.usage);
    const { narrative, delta } = splitOutput(r.text);
    if (!narrative) G.error = { message: 'AI 没有写出开场的正文，可以重试。', action: '__opening__', raw: r.text };
    else {
      const chips = applyDelta(save, delta, 0);
      save.log.push({ id: uid(), turn: 0, action: '', ...(seed ? { seed } : {}), narrative, choices: choicesOf(delta), chips, warns: delta ? [] : ['开场没有返回状态更新，人物和属性保持开局设定。'], at: Date.now(), ...(delta ? {} : { raw: r.text.slice(-4000) }) });
    }
    await persist(save); await saveSettings();
  } catch (e) {
    if (e.name !== 'AbortError') G.error = { message: e.message || String(e), action: '__opening__', raw: e.raw };
  }
  G.busy = false; G.stream = null; G.abort = null; renderLog(); setComposerBusy(false); renderGameHeader();
  const last = save.log[save.log.length - 1];
  if (last && str(last.narrative) && !last.choices?.length) fillChoices(last);
}
/* ---------------- 时间推进：一次过了两年以上，按这个世界的规则推演所有人（含主角）的变化 ---------------- */

3. 每个在世的人到 ${yearLabel(sc, ev.to)} 时的现状（在哪、在做什么、和谁在一起），写在 now 里；有主线时间线的剧本，按这些年里主线的进展来写。

只输出 {"player": {"stats": {}}, "characters": [{"name": "", "stats": {}, "status": "", "now": "", "note": ""}]}` },
    ], { temperature: 0.7, maxTokens: 8000, helper: true, signal: G.abort.signal });
    addUsage(save, r.usage);
    const o = parseLooseJSON(r.text);
    if (!o || (!Array.isArray(o.characters) && !o.player)) throw new Error('AI 返回的内容无法解析');

  } catch (e) {

  }
  G.busy = false; G.abort = null; G.evolving = null;
  await persist(save); await saveSettings();
  renderLog(); renderGameHeader(); setComposerBusy(false); scrollLogToEnd();
}
function applyEvolution(save, o, turn, years) {
  const sc = save.script, st = save.state, chips = [];
  let changed = 0;
  for (const cd of Array.isArray(o.characters) ? o.characters : []) {
    const c = cd && findChar(st.characters, cd.name); if (!c) continue;
    let touched = mergeCharStats(sc, c, cd.stats, null) > 0;
    if (str(cd.status) && str(cd.status) !== c.status) { c.status = str(cd.status); touched = true; if (isGone(c)) chips.push({ t: `${c.name} ${c.status}`, c: 'down' }); }
    if (str(cd.now) && str(cd.now) !== c.now) { c.now = str(cd.now); touched = true; }
    if (str(cd.note)) { c.notes = c.notes || []; c.notes.push({ turn, text: `（这 ${years} 年）${str(cd.note)}` }); touched = true; }
    if (touched) changed++;
  }
  const ps = o.player && typeof o.player === 'object' ? o.player.stats : null;
  if (ps && typeof ps === 'object') {
    for (const def of sc.stats) {
      if (IDENTITY_STATS.includes(def.key) || def.key === 'age') continue;
      const v = ps[def.key] ?? ps[def.label];
      if (v === undefined || v === null || str(v) === '') continue;
      if (def.type === 'number') {
        const before = num(st.stats[def.key]), after = clamp(num(v, before), def.min, def.max);
        if (Math.round(after) !== Math.round(before)) { st.stats[def.key] = after; chips.push({ t: `${def.label} ${Math.round(before)}→${Math.round(after)}`, c: after > before ? 'up' : 'down' }); }
      } else if (str(v) !== str(st.stats[def.key])) { st.stats[def.key] = str(v); chips.push({ t: `${def.label}：${str(v)}` }); }
    }
  }
  chips.unshift({ t: `${years} 年过去，${changed} 个人的情况已推演`, c: 'ev' });
  return chips;
}

  const around = st.characters.filter(c => c.met !== false && c.lastTurn >= entry.turn - 1).map(c => `${c.name}（${c.relation || c.identity}，${sc.relationLabels.friendliness}${Math.round(c.friendliness)}）`).join('、');
  const openEv = st.events.filter(e => !e.resolved).slice(-5).map(e => e.title).join('、');
  const r = await chatOnce([
    { role: 'system', content: '你是互动小说的选项设计者，为玩家提供下一步行动的选项。你只输出 JSON。' },
    { role: 'user', content: `剧本：${sc.title}
主角：${playerName(save)}${genderOf(save) ? `（${genderOf(save)}）` : ''}
主角性格：${st.persona || '（未设定）'}
${st.background ? `主角身世（节选）：${st.background.slice(0, 240)}\n` : ''}当前阶段：${st.stage || '—'}
主角状态：${statLine}
${around ? `身边的人物：${around}\n` : ''}${openEv ? `悬而未决的事：${openEv}\n` : ''}
【刚刚发生的剧情】
${entry.action ? `主角的行动：${entry.action}\n` : ''}${entry.narrative}
${avoid.length ? `\n上一批选项（这次换一批不同的）：${avoid.join('；')}\n` : ''}
请给出 4 个主角接下来可能的行动：
1. 紧接着上面剧情的最后一刻，是主角此刻真的能做的事；
2. 前 3 个贴合主角的性格和处境，方向各不相同（比如说话、行动、观察、回避）；
3. 第 4 个出人意料，不太像${pronounFor(genderOf(save))}平时会做的事；
4. 每个 25 字以内，直接写主角的行动或台词。
只输出 {"choices": ["…", "…", "…", "…"]}` },
  ], { temperature: 1.1, maxTokens: 1200, helper: true });
  addUsage(save, r.usage);
  const out = normalizeChoices(parseLooseJSON(r.text)?.choices);
  if (!out.length) throw new Error('AI 没有给出可用的选项');
  return out;
}
async function fillChoices(entry, regenerate = false) {
  const save = G.save; if (!save || !entry || G.choicesLoading) return;
  G.choicesLoading = entry.id; G.choicesError = null; editingChoice = null; renderLog();
  try {
    const out = await genChoices(save, entry, regenerate ? entry.choices || [] : []);
    if (G.save === save && save.log.includes(entry)) { entry.choices = out; await persist(save); await saveSettings(); }
  } catch (e) {
    G.choicesError = { id: entry.id, message: String(e.message || e).slice(0, 80) };
  } finally {
    entry.choicesTried = true;
    G.choicesLoading = null; renderLog(); scrollLogToEnd();
  }
}
async function regenOpening() {
  const save = G.save; if (!save || G.busy) return;
  // 旧版本留下的空开场没有快照，但它也没有改动过任何状态，可以直接用当前状态
  const snap = (save.snapshots || []).find(x => x.turn === 0) || (save.log.length === 1 && !str(save.log[0].narrative) ? { turn: 0, state: clone(save.state), logLen: 0 } : null);
  if (!snap) { toast('找不到开场前的状态，无法重新生成'); return; }
  restoreState(save, snap.state);
  save.log = []; save.snapshots = [snap]; G.error = null;
  await persist(save); renderLog(); renderGameHeader();
  await startOpening(save);
}

const PLAY_KEYS = ['persona', 'background', 'playInstruction']; // 不随剧情回退的本局设定
async function rollback(silent) { return rewindTo(G.save?.state.turn, silent); }
/* 回到第 turn 回合之前（撤销该回合及之后的所有回合），返回被撤销的那一回合 */
async function rewindTo(turn, silent) {
  const save = G.save; if (!save || G.busy) return false;
  if (!turn || turn <= 0) { if (!silent) toast('已经是开场了'); return false; }
  const snap = (save.snapshots || []).find(s => s.turn === turn);
  if (!snap) { if (!silent) toast('这一回合的存档快照已经不在了，无法回到这里'); return false; }
  const last = save.log.find(e => e.turn === turn);
  restoreState(save, snap.state); // 本局设定和主角身份不随剧情回退
  save.log = save.log.filter(e => e.turn < turn);
  save.snapshots = save.snapshots.filter(s => s.turn < turn);
  G.error = null;
  await persist(save);
  renderLog(); renderGameHeader();
  return last;
}
async function reroll() {
  if (G.busy) return;
  const last = await rollback(true);
  if (!last) { toast('无法重新生成这一回合'); return; }
  playTurn(last.action);
}

let modalResolve = null;
function openModal({ title, body, actions }) {
  return new Promise(res => {
    modalResolve = res;
    $('#modal-head').textContent = title || '';
    const mb = $('#modal-body'); mb.innerHTML = ''; if (body) mb.append(body);
    const mf = $('#modal-foot'); mf.innerHTML = '';
    for (const a of actions || [{ label: '好', value: true, primary: true }]) {
      mf.append(h('button', { class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '') + (a.ghost ? ' ghost' : ''), onclick: async () => {
        if (a.run) { const r = await a.run(); if (r === false) return; }
        closeModal(a.value);
      } }, a.label));
    }
    $('#modal-wrap').hidden = false;
  });
}
function closeModal(v) { $('#modal-wrap').hidden = true; if (modalResolve) { const r = modalResolve; modalResolve = null; r(v); } }
$('#modal-wrap').addEventListener('click', e => { if (e.target.id === 'modal-wrap') closeModal(undefined); });
function ask(title, msg, okLabel = '确定', danger = false) {
  return openModal({ title, body: msg ? h('p', { style: 'margin:4px 0 8px;line-height:1.7' }, msg) : null, actions: [{ label: '取消', value: false, ghost: true }, { label: okLabel, value: true, primary: !danger, danger }] });
}
/* 通用表单：fields = [{key,label,type,options,hint,rows,fold}]
   type: text | textarea | number | select | checkbox | multi | section */
function formModal(title, fields, values, { extra = [], okLabel = '保存', prefix = null } = {}) {
  const body = h('div');
  if (prefix) body.append(prefix);
  const inputs = {}, folds = {};
  const place = (f, el) => {
    if (!f.fold) return body.append(el);
    if (!folds[f.fold]) { folds[f.fold] = h('details', { class: 'fold' }, h('summary', {}, f.fold)); body.append(folds[f.fold]); }
    folds[f.fold].append(el);
  };
  for (const f of fields) {
    if (f.type === 'section') { place(f, h('div', { class: 'sec-h' }, f.label)); continue; }
    if (f.type === 'checkbox') {
      const inp = h('input', { type: 'checkbox', id: 'f-' + f.key }); inp.checked = !!values[f.key];
      inputs[f.key] = inp; place(f, h('label', { class: 'check', for: 'f-' + f.key }, inp, h('span', {}, f.label, f.hint ? h('small', { class: 'muted', style: 'display:block' }, f.hint) : null))); continue;
    }
    if (f.type === 'multi') {
      const cur = new Set(values[f.key] || []);
      const boxes = f.options.map(([v, l, d]) => { const i = h('input', { type: 'checkbox', value: v }); i.checked = cur.has(v); return [i, h('label', {}, i, h('span', {}, l, d ? h('small', {}, d) : null))]; });
      inputs[f.key] = { multi: boxes.map(b => b[0]) };
      place(f, h('div', { class: 'field' }, h('label', {}, f.label), h('div', { class: 'multi' }, ...boxes.map(b => b[1])), f.hint ? h('div', { class: 'hint' }, f.hint) : null));
      continue;
    }
    let inp;
    if (f.type === 'textarea') inp = h('textarea', { id: 'f-' + f.key, rows: f.rows || 3, placeholder: f.placeholder || null });
    else if (f.type === 'select') { inp = h('select', { id: 'f-' + f.key }); for (const [v, l] of f.options) inp.append(h('option', { value: v }, l)); }
    else inp = h('input', { id: 'f-' + f.key, type: f.type === 'number' ? 'number' : 'text', inputmode: f.type === 'number' ? 'decimal' : null, placeholder: f.placeholder || null });
    inp.value = values[f.key] ?? '';
    inputs[f.key] = inp;
    place(f, h('div', { class: 'field' }, h('label', { for: 'f-' + f.key }, f.label), inp, f.hint ? h('div', { class: 'hint' }, f.hint) : null));
  }
  const read = () => { const o = {}; for (const f of fields) { const i = inputs[f.key]; if (!i) continue; o[f.key] = f.type === 'checkbox' ? i.checked : f.type === 'multi' ? i.multi.filter(x => x.checked).map(x => x.value) : f.type === 'number' ? num(i.value, 0) : i.value; } return o; };
  let out = null;
  return openModal({ title, body, actions: [...extra.map(x => ({ ...x, run: x.run ? () => x.run(read()) : undefined })), { label: '取消', value: null, ghost: true }, { label: okLabel, value: 'ok', primary: true, run: () => { out = read(); } }] })
    .then(v => v === 'ok' ? out : (v && v !== null ? v : null));
}

  // 性格

/* ---------------- AI 生成全新主角 ---------------- */
const GEN_SEEDS = ['左撇子', '怕水', '一紧张就结巴', '会唱家乡的小调', '天生一缕白发', '欠着一笔债', '有个双胞胎姐妹', '被退过婚', '养了一只瘸腿的猫', '过目不忘', '母亲不识字', '曾在邪魂师手里死里逃生', '是个路痴', '偷偷写诗', '厨艺惊人', '讨厌下雨天', '小时候偷过东西', '视力不好', '擅长算账', '有一个失踪的哥哥', '背上有一道旧疤', '随身带着一本旧书', '很会讨价还价', '怕黑', '被人冒领过功劳', '睡觉会说梦话', '收集奇怪的石头', '说话带着很重的乡音', '当过杂技团的学徒', '对某个大人物心怀怨恨', '寄养在别人家长大', '有一个不能说的本名', '擅长驯养小动物', '左耳听不见', '常常梦见同一个地方', '喜欢穿男装', '是家里唯一识字的人', '输过一场很重要的比试', '欠某人一条命', '家里开药铺', '被逐出过师门', '有个比她小很多的弟弟要养', '对酒过敏却总被人劝酒', '曾经想当画师'];
function pickN(arr, n) { const a = [...arr], out = []; while (a.length && out.length < n) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]); return out; }
function aiOptionsOf(scriptId) { return clone((S.aiOptions || {})[scriptId] || {}); }
async function saveAiOptions(scriptId, byField) { S.aiOptions[scriptId] = byField; await saveSettings(); }
/* 从某个字段的预设选项推断它可以包含哪些键、设置哪些属性 */
function fieldSchema(f) {
  const keys = new Set(['label', 'desc']), statKeys = new Set();
  for (const o of f.options) { for (const k of Object.keys(o)) if (!['id', 'weight', 'ai'].includes(k)) keys.add(k); for (const k of Object.keys(o.stats || {})) statKeys.add(k); }
  return { keys: [...keys], statKeys: [...statKeys] };
}
function aiTemp() { return clamp(Number(S.temperature) || 1.3, 1.1, 1.5); }
function ctxText(script, ctx) {
  const lines = [`姓名：${ctx.name || '（未定）'}`];
  if (ctx.gender) lines.push(`性别：${ctx.gender}（第三人称用“${pronounFor(ctx.gender)}”）`);
  for (const x of ctx.others || []) if (x.option) lines.push(`${x.label}：${x.option.label.replace(/^✨\s*/, '')}——${fillName(x.option.desc, ctx.name || '主角')}`);
  if (ctx.persona) lines.push(`性格：${ctx.persona}`);
  return lines.join('\n');
}
/* 为开局表的某一项现编一个新选项 */
async function genFieldOption(script, f, ctx, wish) {
  const cr = script.creation || {};
  const sch = fieldSchema(f);
  const statDefs = script.stats.filter(x => sch.statKeys.includes(x.key));
  const roster = (script.characters || []).map(c => c.name);
  const examples = pickN(f.options.filter(o => !o.ai), 2).map(o => { const e = clone(o); delete e.id; delete e.weight; return JSON.stringify(e); }).join('\n');
  const hist = ((S.aiOptions?.[script.id]?.[f.key]) || []).map(o => o.label).slice(-8);
  const keyDocs = [
    '"label"：选项名，15 字以内',
    `"desc"：60～150 字的说明，用 {name} 指代主角，第三人称用“${pronounFor(ctx.gender)}”`,
    statDefs.length ? `"stats"：可以用这些属性：${statDefs.map(d => `${d.key}（${d.label}，${d.type === 'number' ? '数字' + (d.min !== undefined || d.max !== undefined ? `，${d.min ?? ''}～${d.max ?? ''}` : '') : '文本'}）`).join('、')}` : null,
    sch.keys.includes('characters') ? `"characters"：0～1 个与这个设定相关的原创人物，字段与示例相同（含只给 AI 看的 motive、backstory、secret，以及 gender、age${(script.charStats || []).length ? `、stats（${script.charStats.map(d => d.key).join('、')}）` : ''}），"met" 为 true` : null,
    sch.keys.includes('overrides') ? `"overrides"：主角开局时已经认识的原著人物（0～3 人），键为人物名，从这些人里选：${roster.join('、')}；值为 {"met": true, "relation": "关系", "friendliness": 0～100, "opinion": "此人对主角的看法"}` : null,
    sch.keys.includes('stage') ? '"stage"：开局阶段标签（时间 · 地点）' : null,
    sch.keys.includes('opening') ? '"opening"：主角开局时所处的环境和平时的日子，比如常在哪些地方活动、身边有哪些人（100 字以内）' : null,
    sch.keys.includes('objectives') ? '"objectives"：0～2 个开局目标，[{"title": "", "description": ""}]' : null,
    sch.keys.includes('items') ? '"items"：0～2 件随身物品，[{"name": "", "desc": "", "count": 1}]' : null,
  ].filter(Boolean);
  const r = await chatOnce([
    { role: 'system', content: `你是互动小说《${script.title}》的开局设定生成器，负责为主角现编新的设定选项。你只输出 JSON。` },
    { role: 'user', content: `【剧本设定】
${script.world}
${cr.aiGuide ? `\n【总体要求】\n${cr.aiGuide}\n` : ''}
【这次要生成】「${f.label}」的一个全新选项。${f.aiHint ? '\n' + f.aiHint : ''}

【预设选项示例】（格式参考，内容另想一个新的）
${examples}

【主角目前的其他设定】（新选项和这些设定协调一致）
${ctxText(script, ctx)}

【玩家的要求】${str(wish) || '无'}
【灵感关键词】${pickN(GEN_SEEDS, 2).join('、')}（可以不用）
${hist.length ? `【这一项最近生成过】${hist.join('、')}（这次换一个方向）\n` : ''}随机编号：${Math.floor(Math.random() * 1e6)}

只输出一个 JSON 对象，包含这些键：
${keyDocs.join('\n')}` },
  ], { temperature: aiTemp(), maxTokens: 4000 });
  addUsage(null, r.usage);
  const o = parseLooseJSON(r.text);
  if (!o || !str(o.label) || !str(o.desc)) throw new Error('AI 返回的内容无法解析，再试一次');
  const out = { id: 'ai-' + uid(), ai: true, weight: 0, label: str(o.label).slice(0, 24), desc: str(o.desc) };

    const of = creationFields(old).find(x => x.key === f.key); if (!of) continue;
    for (const o of f.options) {

    }

  if (str(old.openingGuide) && str(old.openingGuide) !== str(lib.openingGuide)) swaps.push([str(old.openingGuide), str(lib.openingGuide)]);

    const y0 = calendarOf(lib).start;

      const ex = st.characters.find(x => x.name === c.name);

        for (const f of STATIC) if (c[f] !== undefined && str(c[f])) ex[f] = str(c[f]);
        if (!str(ex.gender) && str(c.gender)) ex.gender = str(c.gender);
        if (!str(ex.now) && str(c.now) && st.year === y0) ex.now = str(c.now); // 现状是故事开始时的；故事已经过了一年以上就不补，交给 AI 更新
        if (ex.born === null || ex.born === undefined) ex.born = bornFrom(c, y0);
        ex.stats = ex.stats || {};
        for (const [k, v] of Object.entries(c.stats || {})) if (ex.stats[k] === undefined || str(ex.stats[k]) === '') ex.stats[k] = v;
      } else { const nc = makeCharacter(c, st.turn, y0); dealSeeds([nc], lib, usedSeeds(st)); st.characters.push(nc); }

}

/* 正文分段；对白加样式；收藏过的句子加划线（marks 是这一回合的收藏） */
function narrHTML(text, marks) {

function paraHTML(p, lines) {
  if (!lines.length || !lines.some(t => p.includes(t))) return esc(p).replace(/(“[^”]{1,400}”|「[^」]{1,400}」)/g, '<span class="dlg">$1</span>');

  for (let i = 0; i < n;) {
    let j = i + 1; while (j < n && dlg[j] === dlg[i] && hl[j] === hl[i]) j++;
    let seg = esc(p.slice(i, j));
    if (dlg[i]) seg = `<span class="dlg">${seg}</span>`;
    if (hl[i]) seg = `<mark class="hl">${seg}</mark>`;

}

$('#btn-open-settings').onclick = () => { renderSettings(); showView('settings'); };

/* ---------------- 版本更新：手机浏览器常常沿用缓存里的旧网页，这里主动去网站上看最新的版本号 ---------------- */
let newBuild = null, updateChecking = false, lastUpdateCheck = 0;
async function fetchLatestBuild() {
  const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const m = (await res.text()).match(/const BUILD = '(\d{4}-\d{2}-\d{2}\.\d+)'/);
  return m ? m[1] : null;
}
async function checkForUpdate(manual = false) {
  if (updateChecking || !/^https?:$/.test(location.protocol)) return;
  if (!manual && Date.now() - lastUpdateCheck < 3 * 60 * 1000) return;
  updateChecking = true; lastUpdateCheck = Date.now();
  try {
    const latest = await fetchLatestBuild();
    if (latest && latest !== BUILD) { newBuild = latest; showUpdateBar(); }
    else if (manual) toast(`已经是最新版本（${BUILD}）`);
  } catch (e) { if (manual) toast('检查更新失败：' + (e.message || e)); }
  finally { updateChecking = false; }
}
function showUpdateBar() {
  $('#update-bar')?.remove();
  document.body.append(h('div', { id: 'update-bar' },
    h('span', {}, `网页有新版本（${newBuild}）。更新后存档和设置都还在。`),
    h('button', { class: 'btn sm primary', onclick: applyUpdate }, '更新'),
    h('button', { class: 'btn sm ghost', 'aria-label': '稍后', onclick: () => $('#update-bar')?.remove() }, '稍后')));
}
async function applyUpdate() {
  if (G.busy) { toast('等这一回合写完再更新'); return; }
  try { await fetch(location.pathname, { cache: 'reload' }); } catch {} // 顺便刷新不带参数的网址的缓存
  location.replace(location.pathname + '?v=' + encodeURIComponent(newBuild || String(Date.now())));
}

/* ---------------- 启动 ---------------- */
(async function boot() {
  await DB.open();
  await loadSettings();
  await loadMarks();
  document.body.append(markBtn);
  if (DB.fallback) toast('浏览器不支持 IndexedDB，改用简易存储，容量较小');
  renderShelf();
  window.addEventListener('beforeunload', e => { if (G.busy) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
  checkForUpdate();
})();
